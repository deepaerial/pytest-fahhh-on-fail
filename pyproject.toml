[project]
name = "pytest-fahhh-on-fail"
description = "A pytest plugin that plays FAHHH meme sound when a test session fails."
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "deepaerial", email = "devaeial@gmail.com" }
]
keywords = ["pytest", "plugin", "sound", "notification", "fail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "playsound3>=3.3.1",
]

[project.urls]
Homepage = "https://github.com/deepaerial/pytest-fahhh"
Repository = "https://github.com/deepaerial/pytest-fahhh"
"Bug Tracker" = "https://github.com/deepaerial/pytest-fahhh/issues"

[project.entry-points."pytest11"]
pytest-fahhh-on-fail = "pytest_fahhh_on_fail.plugin"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "tox>=4.20",
    "tox-uv>=1.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_fahhh_on_fail"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "pyproject.toml",
    "README.md",
    "LICENSE.md",
    "CHANGELOG.md",
]

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
