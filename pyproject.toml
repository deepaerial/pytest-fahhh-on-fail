[project]
name = "pytest-fahhh"
version = "0.1.0"
description = "A pytest plugin that plays FAHHH meme sound when a test session fails."
readme = "README.md"
authors = [
    { name = "deepaerial", email = "nazarii.oleksiuk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "playsound3>=3.3.1",
]

[project.entry-points."pytest11"]
pytest-fahhh = "pytest_fahhh.plugin"

[project.scripts]
pytest-fahhh = "pytest_fahhh:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"
